<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch("SessionCheckServlet", { method: "GET", credentials: "include" })
        .then(res => res.json())
        .then(data => {
        	 if (!data.user) {
           
                 window.location.href = "login.html";
                 return;
             }
        	    document.documentElement.style.visibility = 'visible';
        })
        .catch(err => {
            window.location.href = "login.html";
        });
});
</script>

<div class="container mt-5 mb-5">

    <h3 class="mb-4 text-primary">My Applications</h3>
 
    <div id="applicationList">
        <div class="text-center py-5">
            <div class="spinner-border text-success"></div>
            <p>Loading your applications...</p>
        </div>
    </div>
 
</div>
 
<footer class="site-footer text-center">
    <p>&copy; <script>document.write(new Date().getFullYear());</script> JobBoard. All Rights Reserved.</p>
</footer>

<script>
$(function () {

  fetch("UserApplicationsServlet", {
    method: "GET",
    credentials: "include"   
  })
    .then(async res => {

      console.log("UserApplicationsServlet status:", res.status);
      console.log("document.cookie:", document.cookie);
      const data = await res.json();
 
      if (!res.ok) {
       
        const msg = (data && data.error) ? data.error : "Not logged in";
        $("#applicationList").html(`<div class='no-data'>${msg}</div>`);
        return;
      }

      const apps = Array.isArray(data) ? data : (data.applications || []);
 
      if (!apps || apps.length === 0) {
        $("#applicationList").html(
          `<div class='no-data'>You have not applied for any jobs yet.</div>`
        );
        return;
      }
 
      let html = "";
      apps.forEach(app => {
          html += `
          <div class="app-card">

              <div class="d-flex justify-content-between">
                  <div>
                      <div class="job-title">${app.title}</div>
                      <div class="company">${app.companyName} — ${app.location}</div>
                  </div>

                  <div>
                      <span class="status-box status-${app.status}">
                          ${app.status}
                      </span>
                  </div>
              </div>

              <hr>

              <p><strong>Applied On:</strong> ${app.appliedDate}</p>

              <p><strong>Interview Date:</strong>
                  ${app.interviewDate ? app.interviewDate : "<span style='color:#777'>Not Scheduled</span>"}
              </p>

              <div class="mt-3 text-right">
                  <a href="user-job-details.html?jobId=${app.jobId}" class="btn btn-sm btn-outline-primary">
                      View Job
                  </a>
              </div>

          </div>
          `;
    });

 
      $("#applicationList").html(html);
    })
    .catch(err => {
      console.error("Fetch error:", err);
      $("#applicationList").html(
        `<div class='no-data'>Error loading applications.</div>`
      );
    });
});
</script>
