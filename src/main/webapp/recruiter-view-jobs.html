  <script>
    function showMessage(type, text) {
      const messageBox = document.getElementById('messageBox');
      if (!messageBox) return;
      const alertType = type === 'success' ? 'success' : 'danger';
      messageBox.innerHTML = `
        <div class="alert alert-${alertType} alert-dismissible fade show" role="alert">
          ${text}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
    }

    function hydrateMessageFromQuery() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('msg')) {
        showMessage('success', params.get('msg'));
       
        history.replaceState({}, document.title, window.location.pathname);
      }
    }

    $(document).ready(function() {
      hydrateMessageFromQuery();
      $.ajax({
        url: "RecruiterJobsServlet",
        type: "GET",
        dataType: "json",
        success: function(jobs) {
          const container = $("#jobContainer");
          container.empty();

          if (!jobs || jobs.length === 0) {
            container.html("<p class='text-center text-muted'>No jobs posted yet.</p>");
            return;
          }

          jobs.forEach(job => {
            const jobHTML = `
              <div class="col-md-10 job-card">
                <div class="d-flex justify-content-between align-items-left">
                  <div>
                    <h4>${job.title}</h4>
                    <p class="job-location text-left"><i class="fa-solid fa-location-dot  me-2"></i>${job.location || "Not specified"}</p>
                    <span class="job-type">${job.jobType || "Full-Time"}</span>
                    <p class="mt-2 text-muted text-left"><strong>Salary:</strong> ${job.salary || "N/A"}</p>
                    <p class="text-muted text-left"><strong>Experience:</strong> ${job.experience || "N/A"}</p>
                  </div>
                  <div>
                    <a href="post-job.html?jobId=${job.jobId}" class="edit-btn">Edit</a>
                  </div>
                </div>
              </div>`;
            container.append(jobHTML);
          });
        },
        error: function() {
          $("#jobContainer").html("<p class='text-center text-danger'>Error loading jobs. Please try again later.</p>");
        }
      });
    });
  </script>
