  <script>
document.addEventListener("DOMContentLoaded", function() {
    fetch("/JOB_APPLICATION_SYSTEM/SessionCheckServlet", {
        method: "GET",
        credentials: "include"
    })
    .then(r => r.json())
    .then(d => {
        if (!d.admin) {
            window.location.href = "Employers.html";
            return;
        }
        document.documentElement.style.visibility = "visible";
    })
    .catch(() => window.location.href = "Employers.html");
});
</script>

    ]
  });

  // DELETE
  $('#adminUsersTable tbody').on('click', '.delete', function() {
    var userId = $(this).closest('tr').find('td:eq(0)').text();

    Swal.fire({
      icon: 'warning',
      title: 'Delete User',
      text: 'Are you sure you want to delete this user?',
      showCancelButton: true,
      confirmButtonText: 'Yes, Delete',
      cancelButtonText: 'Cancel',
      confirmButtonColor: '#dc3545',
      cancelButtonColor: '#6c757d'
    }).then((result) => {
      if (result.isConfirmed) {
        $.ajax({
          url: "ManageUsersServlet",
          type: "POST",
          data: { userId, _method: "DELETE" },
          success: function() {
            table.ajax.reload(null,false);
            Swal.fire({
              icon: 'success',
              title: 'Deleted!',
              text: 'User deleted successfully.',
              confirmButtonColor: '#28a745'
            });
          }
        });
      }
    });
  });

  $("#openAddUserModal").click(function() {
    $("#addUserModal").modal("show");
  });


  $("#saveNewUserBtn").click(function () {
    var full_name = $("#add_full_name").val().trim();
    var email = $("#add_email").val().trim();
    var phone = $("#add_phone").val().trim();
    var skills = $("#add_skills").val().trim();
    var password = $("#add_password").val().trim();
    var gender = $("#add_gender").val().trim();
    var qualification = $("#add_qualification").val().trim();


    if (full_name === "" || email === "" || phone === "" || password === "" || gender === "" || qualification === "") {
      Swal.fire({
        icon: 'error',
        title: 'Validation Error',
        text: 'Please fill all required fields.',
        confirmButtonColor: '#28a745'
      });
      return;
    }
    if (!email.match(/^[^@]+@[^@]+\.[^@]+$/)) {
      Swal.fire({
        icon: 'error',
        title: 'Invalid Email',
        text: 'Please enter a valid email address.',
        confirmButtonColor: '#28a745'
      });
      return;
    }
    if (!phone.match(/^[0-9]{10}$/)) {
      Swal.fire({
        icon: 'error',
        title: 'Invalid Phone',
        text: 'Please enter a valid 10-digit phone number.',
        confirmButtonColor: '#28a745'
      });
      return;
    }
    if (password.length < 6) {
      Swal.fire({
        icon: 'error',
        title: 'Weak Password',
        text: 'Password must be at least 6 characters.',
        confirmButtonColor: '#28a745'
      });
      return;
    }

    $.ajax({
      url: "ManageUsersServlet",
      type: "POST",
      data: {
        full_name,
        email,
        phone,
        skills,
        password,
        gender,
        qualification,
        _method: "POST"  
      },
      success: function(response) {
        $("#addUserModal").modal("hide");
        $("#addUserForm")[0].reset();
        $('#adminUsersTable').DataTable().ajax.reload();
        Swal.fire({
          icon: 'success',
          title: 'Success!',
          text: 'User added successfully!',
          confirmButtonColor: '#28a745'
        });
      },
      error: function() {
        Swal.fire({
          icon: 'error',
          title: 'Failed',
          text: 'Failed to add user.',
          confirmButtonColor: '#28a745'
        });
      }
    });
  });



  $("#exportUsersBtn").click(function() {
    window.location.href = "ExcelExportServlet?type=users";
  });
});
</script>
