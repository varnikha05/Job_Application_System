    let multiSelectInitialized=false;
        (function ($) {
            const state = {
                quill: null,
                form: null
            };
          


            const selectors = {
                messageBox: document.getElementById('messageBox'),
                hiddenDescription: document.getElementById('description')
            };

            const messages = {
                defaultError: 'Unable to save job. Please try again.'
            };

            function initMultiSelects() {
            	if(multiSelectInitialized){
            		return;
            	}
            	multiSelectInitialized=true;
                if ($.fn.multiselect) {
                    $('#skills').multiselect({
                        columns: 1,
                        placeholder: 'Select required skills',
                        search: true,
                        selectAll: false
                    });
                    $('#jobType').multiselect({
                        columns: 1,
                        placeholder: 'Select job type(s)',
                        search: false,
                        selectAll: false
                    });
                }
            }

            function syncDescriptionField() {
                if (!selectors.hiddenDescription) {
                    return;
                }
                if (state.quill) {
                    const html = state.quill.root.innerHTML.trim();
                    selectors.hiddenDescription.value = html === '<p><br></p>' ? '' : html;
                } else {
                    const editor = document.getElementById('jobDescriptionEditor');
                    if (editor) {
                        selectors.hiddenDescription.value = editor.innerHTML.trim();
                    }
                }
            }

            function initQuill() {

                if (window.Quill && document.getElementById('jobDescriptionEditor')) {
                    state.quill = new Quill('#jobDescriptionEditor', {
                        theme: 'snow',
                        placeholder: 'Describe the role, responsibilities, and required qualifications.'
                    });
                   
                    syncDescriptionField();
                    state.quill.on('text-change', syncDescriptionField);
                }
            }

            function showMessage(type, text) {
                if (!selectors.messageBox) {
                    return;
                }
                const alertType = type === 'success' ? 'success' : 'danger';
                selectors.messageBox.innerHTML = `
                    <div class="alert alert-${alertType} alert-dismissible fade show" role="alert">
                        ${escapeHtml(text)}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>`;
            }

            function escapeHtml(value) {
                if (!value) {
                    return '';
                }
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function applyClosingDateMin() {
                const closingControl = document.getElementById('closing_date');
                if (closingControl) {
                    closingControl.setAttribute('min', new Date().toISOString().split('T')[0]);
                }
            }

            function hydrateMessageFromQuery() {
                const params = new URLSearchParams(window.location.search);
                if (!params.size) {
                    return;
                }
                if (params.has('error')) {
                    const error = params.get('error');
                    let text = messages.defaultError;
                    if (error === 'missingTitle') {
                        text = 'Job title is required.';
                    } else if (error === 'missingLocation') {
                        text = 'Location is required.';
                    } else if (error === 'unauthorized') {
                        text = 'Your session expired. Please log in as a recruiter again.';
                    } else if (error === 'saveFailed') {
                        text = messages.defaultError;
                    }
                    showMessage('error', text);
                } else if (params.has('msg') && params.get('msg') === 'success') {
                    showMessage('success', 'Job posted successfully!');
                }

            }

         
            function getQueryParam(name) {
                const url = new URL(window.location.href);
                return url.searchParams.get(name);
            }

                $('#company_name').val(job.companyName || '');
                $('#company_website').val(job.companyWebsite || '');
                $('#company_description').val(job.companyDescription || '');
                $('#title').val(job.title || '');
                $('#location').val(job.location || '');
                $('#experience').val(job.experience || '');
                $('#salary').val(job.salary || '');
              
                
                
                if (job.jobType) {
                    let types = Array.isArray(job.jobType) ? job.jobType : String(job.jobType).split(',').map(s => s.trim()).filter(Boolean);
                    $('#jobType').val(types);
                    $('#jobType').multiselect('refresh');
                } else {
                    $('#jobType').val([]);
                    $('#jobType').multiselect('refresh');
                }
                
                if (job.skills) {
                    let skills = Array.isArray(job.skills) ? job.skills : String(job.skills).split(',').map(s => s.trim()).filter(Boolean);
                    $('#skills').val(skills);
                    $('#skills').multiselect('refresh');
                } else {
                    $('#skills').val([]);
                    $('#skills').multiselect('refresh');
                }
              
				if (job.description && state.quill) {
					    setTimeout(() => {
					        state.quill.root.innerHTML = job.description;

					    }, 200);
					}
 				
					else {

                    } else {

                    }
                }
                syncDescriptionField();
                $('#closing_date').val(job.closingDate || '');
                syncDescriptionField();
                setTimeout(() => syncDescriptionField(), 300);
            }
